name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  api:
    name: API Laravel (testes)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl, fileinfo
          coverage: none

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente de teste
        run: cp .env.example .env && php artisan key:generate

      - name: Executar testes Laravel
        run: php artisan test --compact

  apps:
    name: Bundle Expo (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - appUser
          - appMotorista

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Gerar bundle Android do Expo
        run: npx expo export --platform android

